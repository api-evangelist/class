name: Class
description: >-
  Class (Class Technologies Inc.) is an edtech company providing a
  next-generation virtual classroom platform for instructor-led live learning.
  Built on Zoom and Microsoft Teams and delivered on the web as Class
  Collaborate, it adds teaching and engagement tools — interactive breakout
  rooms, engagement analytics, course templates, and automated attendance — and
  integrates with major learning management systems (Canvas, D2L Brightspace,
  Blackboard Learn, Docebo, Cornerstone OnDemand, Open LMS). Class serves K-12
  schools, higher education, government, healthcare, financial services, and
  corporate training. Class publishes a REST API for managing classes,
  enrollments, schedules, templates, users, launch links, and reporting,
  authenticated with scoped API keys.
